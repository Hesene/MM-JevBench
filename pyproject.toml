[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mmjevbench"
version = "0.1.0"
description = "Paper-oriented evaluation suite for calibrated multimodal typed-decision models"
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.20",
  "numpy>=1.26",
  "Pillow>=10.0",
  "pyarrow>=15.0",
  "PyYAML>=6.0",
  "requests>=2.31"
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["mmjevbench*"]

